<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pie-lab install</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(720px, calc(100vw - 32px));
    }

    code {
      display: block;
      overflow-x: auto;
      padding: 16px;
      border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, CanvasText 7%, Canvas);
    }

    a {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main>
    <h1>pie-lab</h1>
    <p>Install the <code>pie</code> CLI from the public npm package:</p>
    <code>curl -fsSL https://jikime.github.io/pie-lab/install.sh | sh</code>
    <p>
      Source and documentation:
      <a href="https://github.com/jikime/pie-lab">github.com/jikime/pie-lab</a>
    </p>
  </main>
</body>
</html>
